[project]
name = "backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "argon2-cffi>=25.1.0",
    "boto3>=1.44.4",
    "fastapi>=0.162.7",
    "pydantic>=2.14.3",
    "pymongo>=4.20.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "slowapi>=0.1.10",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
]
